openapi: 3.0.3
info:
  title: Users and Tasks API
  version: 1.0.0
  description: Initial API contract for managing users and tasks.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Users
  - name: Tasks
paths:
  /api/auth/register:
    post:
      tags: [Users]
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, format: password }
      responses:
        '201': { description: User registered; returns public user and JWT }
        '400': { description: Invalid input }
        '409': { description: Email already exists }
  /api/auth/login:
    post:
      tags: [Users]
      summary: Login and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Login successful; returns public user and JWT }
        '401': { description: Invalid credentials }
  /api/auth/me:
    get:
      tags: [Users]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200': { description: Current user }
        '401': { description: Authentication required }
  /api/users:
    get:
      tags: [Users]
      summary: List users
      responses:
        '200':
          description: Users returned successfully
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
        '400':
          description: Invalid input
        '409':
          description: Email already exists
  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Users]
      summary: Get a user
      responses:
        '200':
          description: User found
        '404':
          description: User not found
    put:
      tags: [Users]
      summary: Replace a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: User updated
        '404':
          description: User not found
    delete:
      tags: [Users]
      summary: Delete a user
      responses:
        '204':
          description: User deleted
        '404':
          description: User not found
  /api/tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      responses:
        '200':
          description: Tasks returned successfully
    post:
      tags: [Tasks]
      summary: Create a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '404':
          description: User not found
  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tasks]
      summary: Get a task
      responses:
        '200':
          description: Task found
        '404':
          description: Task not found
    put:
      tags: [Tasks]
      summary: Replace a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '200':
          description: Task updated
        '401':
          description: Authentication required
        '404':
          description: Task not found
    delete:
      tags: [Tasks]
      summary: Delete a task
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Task deleted
        '401':
          description: Authentication required
        '404':
          description: Task not found
  /api/tasks/user/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Tasks]
      summary: List tasks belonging to the authenticated user
      responses:
        '200':
          description: User tasks returned
        '404':
          description: User not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    UserCreate:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
    TaskCreate:
      type: object
      required: [title, userId]
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed]
          default: pending
        userId:
          type: integer
    Task:
      allOf:
        - $ref: '#/components/schemas/TaskCreate'
        - type: object
          properties:
            id:
              type: integer
